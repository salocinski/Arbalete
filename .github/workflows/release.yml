# Publication d'une version (ARB-77, EP-14) : construit l'installeur de la VERSION de main et la publie dans une Release
# GitHub, d'où electron-updater lit `latest.yml`. Lancé à la main (onglet Actions, ou `gh workflow run release.yml`) :
# toutes les versions de VERSION ne sont pas des versions distribuées. Le tag est celui de `latest.yml` (vX.Y.Z semver,
# 0.12.44.22 -> v0.12.44022, voir src/shared/version.ts) ; une Release qui existe déjà fait échouer l'étape.
# shortcut: installeur non signé (ARB-76) ; les actions sont épinglées comme dans ci.yml.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: arbalete-browser

jobs:
  publier:
    name: Installeur et Release GitHub
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    # Seul job qui écrit : il crée la Release (brouillon, puis publiée une fois les fichiers envoyés).
    permissions:
      contents: write
    env:
      CLE_CACHE_ELECTRON: electron-windows-45.2.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: arbalete-browser/package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\electron-cache
          key: ${{ env.CLE_CACHE_ELECTRON }}
      - run: npx install-electron
        env:
          electron_config_cache: ${{ runner.temp }}\electron-cache
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run dist
      - name: Créer la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(sed -n 's/^version: //p' release/latest.yml)"
          gh release create "$TAG" release/Arbalete-Setup-*.exe release/Arbalete-Setup-*.exe.blockmap release/latest.yml \
            --draft --target "$GITHUB_SHA" --title "Arbalète $TAG" --generate-notes
          gh release edit "$TAG" --draft=false
