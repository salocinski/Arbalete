# Publication d'une version (ARB-77, EP-14) : construit l'installeur de la VERSION de main et la publie dans une Release
# GitHub, d'où electron-updater lit `latest.yml`. Lancé à la main (onglet Actions, ou `gh workflow run release.yml`) :
# toutes les versions de VERSION ne sont pas des versions distribuées. Le tag est celui de `latest.yml` (vX.Y.Z semver,
# 0.12.44.22 -> v0.12.44022, voir src/shared/version.ts) ; une Release qui existe déjà fait échouer l'étape.
# ARB-76 : l'application (Arbalete.exe) puis l'installeur sont signés par SignPath (SignPath Foundation, certificat gratuit des
# projets open source) ; chaque demande de signature attend l'approbation d'un approbateur dans SignPath. Il faut la variable
# de dépôt SIGNPATH_ORGANIZATION_ID et le secret SIGNPATH_API_TOKEN ; sans eux le workflow s'arrête avant de construire.
# `latest.yml` est remis d'accord avec l'installeur signé (scripts/apres-signature.mjs) et son blockmap n'est pas publié.
# Les actions sont épinglées comme dans ci.yml.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: arbalete-browser

jobs:
  publier:
    name: Installeur et Release GitHub
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    # Seul job qui écrit : il crée la Release (brouillon, puis publiée une fois les fichiers envoyés).
    # `actions: read` : SignPath relit l'artefact envoyé par ce job pour vérifier qu'il vient bien de ce workflow.
    permissions:
      contents: write
      actions: read
    env:
      CLE_CACHE_ELECTRON: electron-windows-45.3.2
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - name: Vérifier la configuration de signature
        shell: bash
        working-directory: .  # avant le checkout, arbalete-browser n'existe pas encore
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -z "$SIGNPATH_ORGANIZATION_ID" ] || [ -z "$SIGNPATH_API_TOKEN" ]; then
            echo "::error::Signature impossible : variable SIGNPATH_ORGANIZATION_ID ou secret SIGNPATH_API_TOKEN manquant (voir README, « Signature du code »)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: arbalete-browser/package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\electron-cache
          key: ${{ env.CLE_CACHE_ELECTRON }}
      - run: npx install-electron
        env:
          electron_config_cache: ${{ runner.temp }}\electron-cache
      - run: npm run typecheck
      - run: npm run test:unit
      # 1. Application et installeur non signés : seul ce build écrit app-update.yml dans l'application (ni `--dir` ni
      #    `--prepackaged` ne le font) ; l'installeur est refait à l'étape 2 avec l'application signée.
      - run: npm run dist
      - id: app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-a-signer
          path: arbalete-browser/release/win-unpacked/Arbalete.exe
      - uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: arbalete
          signing-policy-slug: release-signing
          artifact-configuration-slug: application
          github-artifact-id: ${{ steps.app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signe/application
      - name: Remplacer l'application par celle signée
        shell: pwsh
        run: |
          Copy-Item ../signe/application/Arbalete.exe release/win-unpacked/Arbalete.exe -Force
          $s = Get-AuthenticodeSignature release/win-unpacked/Arbalete.exe
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'CN=SignPath Foundation') { throw "Application mal signée : $($s.Status) $($s.SignerCertificate.Subject)" }
      # 2. Installeur de l'application signée, signé à son tour.
      - run: npm run dist -- --prepackaged release/win-unpacked
      - id: installeur
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installeur-a-signer
          path: arbalete-browser/release/Arbalete-Setup-*.exe
      - uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: arbalete
          signing-policy-slug: release-signing
          artifact-configuration-slug: installeur
          github-artifact-id: ${{ steps.installeur.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signe/installeur
      - name: Remplacer l'installeur par celui signé
        shell: pwsh
        run: |
          Copy-Item ../signe/installeur/Arbalete-Setup-*.exe release/ -Force
          $s = Get-AuthenticodeSignature (Get-Item release/Arbalete-Setup-*.exe)
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'CN=SignPath Foundation') { throw "Installeur mal signé : $($s.Status) $($s.SignerCertificate.Subject)" }
          node scripts/apres-signature.mjs
      - name: Créer la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(sed -n 's/^version: //p' release/latest.yml)"
          gh release create "$TAG" release/Arbalete-Setup-*.exe release/latest.yml \
            --draft --target "$GITHUB_SHA" --title "Arbalète $TAG" --generate-notes
          gh release edit "$TAG" --draft=false
