# Installeur Windows (ARB-75, NSIS). Mises à jour automatiques par GitHub Releases (ARB-77) ; signature par SignPath dans release.yml (ARB-76).
appId: Arbalete
productName: Arbalète
copyright: Arbalète, GPL-3.0-or-later
directories:
  output: release
files:
  - out/**
  - "!out/web/**"
  - package.json
asar: true
# Écrit app-update.yml dans l'application et latest.yml à côté de l'installeur (lus par electron-updater, ARB-77).
publish:
  provider: github
  owner: salocinski
  repo: Arbalete
  releaseType: release
  # ARB-76 : écrit dans app-update.yml, electron-updater refuse alors une mise à jour dont la signature n'est pas celle de ce
  # certificat. La signature elle-même est faite par SignPath dans release.yml (aucun certificat ici). Un build local, non signé,
  # ne peut donc pas se mettre à jour : seule l'application publiée par release.yml le peut.
  publisherName:
    - SignPath Foundation
# L'icône et les licences OFL des polices restent hors d'app.asar : la fenêtre lit l'icône sur disque (CHEMIN_ICONE).
extraResources:
  - from: resources/icone.ico
    to: icone.ico
  - from: src/renderer/src/design-system/licences-polices
    to: licences-polices
  - from: ../LICENSE
    to: LICENSE.txt
win:
  executableName: Arbalete
  icon: resources/icone.ico
  target:
    - target: nsis
      arch: x64
  artifactName: Arbalete-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Les données de l'utilisateur (%APPDATA%) survivent à la désinstallation, comme chez les autres navigateurs.
  deleteAppDataOnUninstall: false
  # Déclaration à Windows comme navigateur possible (ARB-80).
  include: build/installer.nsh
